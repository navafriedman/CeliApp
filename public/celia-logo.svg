<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Celia v1: Minimal geometric girl with bob haircut -->
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#F3E8FF"/>

  <!-- Hair (bob style) -->
  <path d="M25 45 Q25 25, 50 20 Q75 25, 75 45 L75 55 Q75 65, 65 65 L65 50 Q65 35, 50 32 Q35 35, 35 50 L35 65 Q25 65, 25 55 Z" fill="#7C3AED"/>

  <!-- Face -->
  <circle cx="50" cy="48" r="18" fill="#FED7AA"/>

  <!-- Eyes - simple dots -->
  <circle cx="44" cy="46" r="2.5" fill="#1F2937"/>
  <circle cx="56" cy="46" r="2.5" fill="#1F2937"/>

  <!-- Smile -->
  <path d="M44 54 Q50 58, 56 54" stroke="#1F2937" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <circle cx="40" cy="52" r="3" fill="#FECACA" opacity="0.6"/>
  <circle cx="60" cy="52" r="3" fill="#FECACA" opacity="0.6"/>

  <!-- Small leaf/sprout accessory in hair -->
  <path d="M62 28 Q68 22, 65 15 Q58 18, 62 28" fill="#34D399"/>
  <line x1="62" y1="28" x2="60" y2="32" stroke="#34D399" stroke-width="2"/>
</svg>
